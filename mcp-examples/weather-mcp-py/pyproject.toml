[tool.poetry]
name = "weather-mcp-py"
version = "0.1.0"
description = "Weather MCP Server with Nevermined Payments Integration (Python)"
authors = ["Nevermined"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
# The `fastapi` extra pulls fastapi + starlette for the MCP server. uvicorn is
# declared explicitly because the MCP server's start() imports it at runtime but
# the SDK's `fastapi` extra does not (yet) include it.
payments-py = {version = "^1.15.0", extras = ["fastapi"]}
uvicorn = "^0.31.1"
httpx = "^0.28.0"
python-dotenv = "^1.0.0"
openai = "^1.0.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^1.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
